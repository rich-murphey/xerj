[package]
name = "xerj-cmem-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "all-MiniLM-L6-v2 embedder that reproduces claude-mem's stored vectors (256-token cap, Chroma-compatible truncation), and an answerai-colbert-small-v1 late-interaction encoder, both on ONNX Runtime"

[dependencies]
serde_json.workspace = true
# The binaries only.
anyhow.workspace = true
thiserror.workspace = true
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
# fp16 storage form of ColBERT token vectors.
half = "2"
# ColBERT's `linear.weight` when the ONNX graph has no head.
safetensors = "0.7"
# ONNX Runtime, as xerj-ai's: the same version and features. The build
# downloads a static onnxruntime from pyke's CDN (`ORT_LIB_LOCATION` points
# it at a local one instead). pyke ships no musl build, so there is no musl
# build of this crate; no release or CI job makes one (release.yml builds
# `-p xerj-server` only, and nothing in the workspace depends on this crate).
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std", "ndarray", "tracing", "download-binaries", "tls-rustls",
    "copy-dylibs", "api-24",
] }
# For its process-wide ONNX Runtime environment, which ort allows only once.
xerj-ai = { path = "../xerj-ai", features = ["onnx-experimental"] }

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "colbert"
path = "src/bin/colbert.rs"
