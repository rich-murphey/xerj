[package]
name = "xerj-cmem-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "all-MiniLM-L6-v2 embedder that reproduces claude-mem's stored vectors (256-token cap, Chroma-compatible truncation), and an answerai-colbert-small-v1 late-interaction encoder"

[dependencies]
serde_json.workspace = true
# The `parity` binary only.
anyhow.workspace = true
thiserror.workspace = true
# Same versions as xerj-ai's `neural` feature, so this can move beside it.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
# fp16 storage form of ColBERT token vectors; already in the tree under candle.
half = "2"
# EXPERIMENTAL GNU/Linux ONNX Runtime backend for ColBERT, as xerj-ai's: the
# same version and features, off by default so candle stays the musl path.
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = [
    "std", "ndarray", "tracing", "download-binaries", "tls-rustls",
    "copy-dylibs", "api-24",
] }

[features]
default = []
onnx-experimental = ["dep:ort"]

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "colbert"
path = "src/bin/colbert.rs"
